# Development environment: web, MySQL, RabbitMQ and Kafka connections.
server.port=${MOCK_PORT:17001}

spring.datasource.url=${MOCK_DB_URL:jdbc:mysql://localhost:3306/matching_mock?connectionTimeZone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${MOCK_DB_USERNAME:root}
spring.datasource.password=${MOCK_DB_PASSWORD:}
spring.jpa.database-platform=${MOCK_DB_DIALECT:org.hibernate.community.dialect.MySQLLegacyDialect}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.cloud.stream.kafka.binder.brokers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Unique per concurrently running mock instance (0-1023).
mock.snowflake.worker-id=${MOCK_SNOWFLAKE_WORKER_ID:0}
