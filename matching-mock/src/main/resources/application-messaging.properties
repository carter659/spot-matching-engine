spring.cloud.function.definition=results;market
spring.cloud.stream.binders.rabbit.type=rabbit
spring.cloud.stream.binders.kafka.type=kafka
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.cloud.stream.output-bindings=commands-out-0
mock.data-directory=${MOCK_DATA_DIRECTORY:data/mock}
spring.cloud.stream.bindings.commands-out-0.binder=rabbit
spring.cloud.stream.bindings.commands-out-0.producer.error-channel-enabled=true
spring.cloud.stream.bindings.commands-out-0.destination=${MATCHING_COMMAND_DESTINATION:matching.commands}
spring.cloud.stream.bindings.commands-out-0.producer.required-groups=engine
spring.cloud.stream.bindings.results-in-0.binder=rabbit
spring.cloud.stream.bindings.results-in-0.destination=${MATCHING_RESULT_DESTINATION:matching.results}
spring.cloud.stream.bindings.results-in-0.group=mock-results
# Inbox persistence is synchronized, so extra consumers would contend on the same lock.
spring.cloud.stream.bindings.results-in-0.consumer.concurrency=1
spring.cloud.stream.rabbit.bindings.results-in-0.consumer.container-type=${MATCHING_RESULT_CONTAINER_TYPE:direct}
# Buffer confirmed results without waiting for an ACK round trip before each delivery.
spring.cloud.stream.rabbit.bindings.results-in-0.consumer.prefetch=${MATCHING_RESULT_PREFETCH:128}
spring.cloud.stream.bindings.results-in-0.consumer.max-attempts=1
spring.cloud.stream.bindings.market-in-0.binder=kafka
spring.cloud.stream.bindings.market-in-0.destination=${MATCHING_MARKET_DESTINATION:matching.market}
spring.cloud.stream.bindings.market-in-0.group=mock-market
spring.cloud.stream.bindings.market-in-0.consumer.max-attempts=1
spring.cloud.stream.kafka.bindings.market-in-0.consumer.start-offset=latest
spring.cloud.stream.default.content-type=application/json
spring.cloud.stream.rabbit.default.consumer.acknowledge-mode=MANUAL
spring.cloud.stream.rabbit.default.consumer.prefetch=1
spring.cloud.stream.rabbit.default.consumer.single-active-consumer=true
spring.cloud.stream.rabbit.default.consumer.auto-bind-dlq=true
spring.cloud.stream.rabbit.default.consumer.republish-to-dlq=false
spring.cloud.stream.rabbit.default.consumer.requeue-rejected=false
spring.cloud.stream.rabbit.default.consumer.exchange-auto-delete=false
spring.cloud.stream.rabbit.default.producer.use-confirm-header=true
spring.cloud.stream.rabbit.default.producer.delivery-mode=PERSISTENT
spring.cloud.stream.rabbit.default.producer.auto-bind-dlq=true
spring.cloud.stream.rabbit.default.producer.single-active-consumer=true
spring.cloud.stream.rabbit.default.producer.exchange-auto-delete=false
