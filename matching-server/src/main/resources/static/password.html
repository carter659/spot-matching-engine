<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>修改密码 · 撮合引擎</title><link rel="stylesheet" href="/engine.css"><script src="/admin.js" defer></script></head><body data-page="password"><main><header><a class="brand" href="/">◈ BITUAN <span>/ MATCHING SERVER</span></a><nav aria-label="管理导航"><a  href="/">数据看板</a><a  href="/configuration.html">参数配置</a><a aria-current="page" href="/password.html">修改密码</a></nav><button id="logout" class="quiet">退出登录</button></header><div class="narrow"><div class="eyebrow">ACCOUNT SECURITY</div><h1>修改密码</h1><p class="intro">当前账号：root。修改成功后，所有已登录会话失效，请使用新密码重新登录。</p><section><form id="password-form"><label>当前密码<input id="old-password" type="password" autocomplete="current-password" required maxlength="128"></label><label>新密码<input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><label>确认新密码<input id="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><p class="muted">新密码长度 8–128 个字符。</p><button class="primary" id="password-submit">保存新密码</button></form></section><p id="status" role="status" aria-live="polite">密码以加盐哈希保存。</p></div></main></body></html>
