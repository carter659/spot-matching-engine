spring.application.name=matching-server
server.port=${SERVER_PORT:17000}
matching.journal-path=${MATCHING_JOURNAL_PATH:${matching.home:.}/data/engine/commands.journal}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.tracking-modes=cookie
spring.profiles.default=messaging
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# Each message binding must explicitly select rabbit or kafka.
spring.cloud.stream.binders.rabbit.type=rabbit
spring.cloud.stream.binders.kafka.type=kafka

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.cloud.stream.kafka.binder.brokers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# RabbitMQ HTTP management API; credentials stay on the server.
matching.rabbitmq.management-url=${RABBITMQ_MANAGEMENT_URL:http://${spring.rabbitmq.host}:15672}
matching.rabbitmq.management-username=${RABBITMQ_MANAGEMENT_USERNAME:${spring.rabbitmq.username}}
matching.rabbitmq.management-password=${RABBITMQ_MANAGEMENT_PASSWORD:${spring.rabbitmq.password}}
