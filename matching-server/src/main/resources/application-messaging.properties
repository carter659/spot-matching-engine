spring.cloud.function.definition=commands
spring.cloud.stream.output-bindings=results-out-0
spring.cloud.stream.bindings.commands-in-0.binder=rabbit
spring.cloud.stream.bindings.commands-in-0.destination=${MATCHING_COMMAND_DESTINATION:matching.commands}
spring.cloud.stream.bindings.commands-in-0.group=engine
# Keep one ordered command consumer; higher prefetch can reorder failed redeliveries.
spring.cloud.stream.bindings.commands-in-0.consumer.concurrency=1
# Direct delivery avoids the Simple container's extra consumer-thread handoff.
spring.cloud.stream.rabbit.bindings.commands-in-0.consumer.container-type=${MATCHING_COMMAND_CONTAINER_TYPE:direct}
spring.cloud.stream.rabbit.bindings.commands-in-0.consumer.prefetch=1
spring.cloud.stream.bindings.commands-in-0.consumer.max-attempts=1
spring.cloud.stream.bindings.results-out-0.binder=rabbit
spring.cloud.stream.bindings.results-out-0.producer.error-channel-enabled=true
spring.cloud.stream.bindings.results-out-0.destination=${MATCHING_RESULT_DESTINATION:matching.results}
spring.cloud.stream.bindings.results-out-0.producer.required-groups=mock-results
spring.cloud.stream.bindings.market-out-0.binder=kafka
spring.cloud.stream.bindings.market-out-0.destination=${MATCHING_MARKET_DESTINATION:matching.market}
spring.cloud.stream.kafka.bindings.market-out-0.producer.message-key-expression=headers['partitionKey']
spring.cloud.stream.kafka.bindings.market-out-0.producer.configuration.key.serializer=org.apache.kafka.common.serialization.StringSerializer
spring.cloud.stream.kafka.bindings.market-out-0.producer.sync=true
spring.cloud.stream.kafka.bindings.market-out-0.producer.send-timeout-expression=6000
spring.cloud.stream.kafka.bindings.market-out-0.producer.configuration.acks=1
spring.cloud.stream.kafka.bindings.market-out-0.producer.configuration.enable.idempotence=false
spring.cloud.stream.kafka.bindings.market-out-0.producer.configuration.max.block.ms=1000
spring.cloud.stream.kafka.bindings.market-out-0.producer.configuration.delivery.timeout.ms=5000
spring.cloud.stream.kafka.bindings.market-out-0.producer.configuration.request.timeout.ms=3000
spring.cloud.stream.default.content-type=application/json
spring.cloud.stream.rabbit.default.consumer.acknowledge-mode=MANUAL
spring.cloud.stream.rabbit.default.consumer.prefetch=1
spring.cloud.stream.rabbit.default.consumer.single-active-consumer=true
spring.cloud.stream.rabbit.default.consumer.auto-bind-dlq=true
spring.cloud.stream.rabbit.default.consumer.republish-to-dlq=false
spring.cloud.stream.rabbit.default.consumer.requeue-rejected=false
spring.cloud.stream.rabbit.default.consumer.exchange-auto-delete=false
spring.cloud.stream.rabbit.default.producer.use-confirm-header=true
spring.cloud.stream.rabbit.default.producer.delivery-mode=PERSISTENT
spring.cloud.stream.rabbit.default.producer.auto-bind-dlq=true
spring.cloud.stream.rabbit.default.producer.single-active-consumer=true
spring.cloud.stream.rabbit.default.producer.exchange-auto-delete=false
